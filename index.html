<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Krishna Animation</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#app {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

h1 {
    position: absolute;
    top: 20px;
    margin: 0;
    z-index: 10;
    font-size: 24px;
    letter-spacing: 2px;
}

button {
    position: absolute;
    top: 65px;
    z-index: 10;

    padding: 12px 25px;
    border: 1px solid #00ffff;
    border-radius: 30px;

    background: #071414;
    color: #00ffff;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 0 10px #00ffff,
        inset 0 0 10px rgba(0,255,255,.2);
}

button:hover {
    background: #00ffff;
    color: #000;
}

canvas {
    width: 100vw;
    height: 100vh;
    display: block;
}
</style>
</head>

<body>

<div id="app">

<h1>NEON KRISHNA</h1>

<button id="run">▶ RUN ANIMATION</button>

<canvas id="canvas"></canvas>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;

const image = new Image();
image.src = "krishna.png";

let particles = [];

let running = false;
let startTime = 0;

const revealDuration = 3500;
const neonDuration = 3000;
const fadeDuration = 1500;

function resize() {

    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;

}

window.addEventListener("resize", resize);

resize();


function createParticles() {

    particles = [];

    const temp = document.createElement("canvas");
    const tctx = temp.getContext("2d");

    const size = Math.min(W, H) * 0.85;

    temp.width = size;
    temp.height = size;

    tctx.drawImage(
        image,
        0,
        0,
        size,
        size
    );

    const data = tctx.getImageData(
        0,
        0,
        size,
        size
    ).data;

    for (
        let y = 0;
        y < size;
        y += 5
    ) {

        for (
            let x = 0;
            x < size;
            x += 5
        ) {

            const i =
                (y * size + x) * 4;

            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            const a = data[i + 3];

            const brightness =
                r + g + b;

            if (
                a > 80 &&
                brightness > 45
            ) {

                particles.push({

                    x:
                        (W - size) / 2 + x,

                    y:
                        (H - size) / 2 + y,

                    color:
                        `rgb(${r},${g},${b})`,

                    delay:
                        Math.random() * 2500,

                    size:
                        Math.random() * 2 + 1,

                    angle:
                        Math.random() *
                        Math.PI * 2,

                    distance:
                        Math.random() * 100 + 20

                });

            }

        }

    }

}


function drawBackground() {

    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

}


function drawParticles(progress) {

    for (const p of particles) {

        const local =
            Math.max(
                0,
                Math.min(
                    1,
                    (progress * 3500 - p.delay) /
                    1200
                )
            );

        if (local <= 0)
            continue;

        const ease =
            1 - Math.pow(1 - local, 3);

        const startX =
            p.x +
            Math.cos(p.angle) *
            p.distance;

        const startY =
            p.y +
            Math.sin(p.angle) *
            p.distance;

        const x =
            startX +
            (p.x - startX) * ease;

        const y =
            startY +
            (p.y - startY) * ease;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = p.color;

        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;

        ctx.fill();

    }

}


function drawNeon() {

    ctx.globalCompositeOperation =
        "lighter";

    for (const p of particles) {

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size * 1.3,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = p.color;

        ctx.shadowBlur = 18;
        ctx.shadowColor = p.color;

        ctx.fill();

    }

    ctx.globalCompositeOperation =
        "source-over";

}


function drawOriginal(alpha) {

    const size =
        Math.min(W, H) * 0.85;

    const x =
        (W - size) / 2;

    const y =
        (H - size) / 2;

    ctx.save();

    ctx.globalAlpha = alpha;

    ctx.shadowBlur = 20;
    ctx.shadowColor =
        "rgba(0,255,255,.5)";

    ctx.drawImage(
        image,
        x,
        y,
        size,
        size
    );

    ctx.restore();

}


function animate(timestamp) {

    if (!running)
        return;

    const elapsed =
        timestamp - startTime;

    drawBackground();

    if (
        elapsed <
        revealDuration
    ) {

        const progress =
            elapsed / revealDuration;

        drawParticles(progress);

    }

    else if (
        elapsed <
        revealDuration +
        neonDuration
    ) {

        drawNeon();

    }

    else if (
        elapsed <
        revealDuration +
        neonDuration +
        fadeDuration
    ) {

        drawNeon();

        const t =
            (
                elapsed -
                revealDuration -
                neonDuration
            ) / fadeDuration;

        drawOriginal(t);

    }

    else {

        drawOriginal(1);

        running = false;

        document.getElementById("run")
            .style.display = "block";

        return;

    }

    requestAnimationFrame(animate);

}


document.getElementById("run")
    .addEventListener("click", () => {

        createParticles();

        running = true;

        startTime =
            performance.now();

        document.getElementById("run")
            .style.display = "none";

        requestAnimationFrame(animate);

    });


image.onload = () => {

    drawBackground();

};

</script>

</body>
</html>
